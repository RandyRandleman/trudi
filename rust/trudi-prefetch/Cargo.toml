[package]
name = "trudi-prefetch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Linux-native Windows Prefetch reader for TRUDI — emits one JSONL record per .pf file"
license = "MIT"
publish = false

[dependencies]
# Pinned exactly. prefetch-core carries its own clean-room MS-XCA Xpress-Huffman
# decoder, so MAM-compressed (Win8+) prefetch parses without any Windows API.
# Apache-2.0.
prefetch-core = "=0.1.1"
serde_json = "=1.0.145"

[profile.release]
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
